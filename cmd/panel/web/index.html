<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emby Relay Hub</title>
  <link rel="stylesheet" href="/static/web/style.css?v=20260307c" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Emby Relay Hub</h1>
      <p>3 steps: Agent -> Emby -> Bind. Token and commands are handled by panel.</p>
      <div class="token">
        <input id="adminToken" placeholder="Optional: ADMIN_TOKEN" />
        <button id="saveToken">Save Token</button>
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <h2>1) Add Agent</h2>
        <form id="agentForm">
          <input name="name" placeholder="Agent name (e.g. HK-01)" required />
          <input name="host" placeholder="Public IP / Domain" required />
          <button type="submit">Create Agent</button>
        </form>
        <div id="agentList"></div>
      </article>

      <article class="card">
        <h2>2) Add Emby Upstream</h2>
        <form id="upstreamForm" class="row5">
          <input name="name" placeholder="Upstream name" required />
          <select name="scheme">
            <option value="http">http</option>
            <option value="https" selected>https</option>
          </select>
          <input name="host" placeholder="Public IP / Domain" required />
          <input name="port" type="number" min="1" max="65535" placeholder="Port" required />
          <input name="path" placeholder="Base Path (optional, e.g. /emby)" />
          <select name="tls_mode" id="tlsMode">
            <option value="strict" selected>TLS: strict</option>
            <option value="insecure">TLS: insecure</option>
            <option value="custom_ca">TLS: custom CA</option>
          </select>
          <textarea name="ca_cert_pem" id="caPem" rows="3" placeholder="CA PEM (required when custom CA)" style="display:none;"></textarea>
          <button type="button" id="probeUpstream">Probe Emby</button>
          <button type="submit">Create Upstream</button>
        </form>
        <div id="upstreamList"></div>
      </article>

      <article class="card wide">
        <h2>3) Bind Agent -> Emby (optional domain)</h2>
        <form id="bindForm" class="row3">
          <select id="bindAgent" name="agent_id" required></select>
          <select id="bindUpstream" name="upstream_id" required></select>
          <input name="domain" placeholder="Domain (optional, e.g. emby.example.com)" />
          <button type="submit">Create Binding</button>
        </form>
        <div id="routeList"></div>
      </article>
    </section>

    <section class="card">
      <h2>Command Output</h2>
      <textarea id="commandBox" rows="4" readonly></textarea>
    </section>
  </main>

  <script src="/static/web/app.js?v=20260307c"></script>
</body>
</html>
